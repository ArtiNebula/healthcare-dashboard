name: CD — Deploy to K8s

on:
  push:
    branches: [main]

env:
  DOCKERHUB_USERNAME: artisingh3106

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/healthcare-backend:latest
            ${{ env.DOCKERHUB_USERNAME }}/healthcare-backend:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/healthcare-frontend:latest
            ${{ env.DOCKERHUB_USERNAME }}/healthcare-frontend:${{ github.sha }}

      - name: Deploy to K8s
        run: |
          kubectl set image deployment/backend `
            backend=${{ env.DOCKERHUB_USERNAME }}/healthcare-backend:${{ github.sha }} `
            -n healthcare
          kubectl set image deployment/frontend `
            frontend=${{ env.DOCKERHUB_USERNAME }}/healthcare-frontend:${{ github.sha }} `
            -n healthcare
          kubectl rollout status deployment/backend -n healthcare --timeout=120s
          kubectl rollout status deployment/frontend -n healthcare --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get pods -n healthcare
          kubectl get services -n healthcare
