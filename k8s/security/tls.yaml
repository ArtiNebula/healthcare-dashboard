# TLS Secret (replace crt/key with real base64-encoded cert)
apiVersion: v1
kind: Secret
metadata:
  name: healthcare-tls
  namespace: healthcare
type: kubernetes.io/tls
data:
  tls.crt: LS0tLS1CRUdJTi... # base64 encoded cert
  tls.key: LS0tLS1CRUdJTi... # base64 encoded key

---
# Ingress with TLS enabled
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthcare-ingress-tls
  namespace: healthcare
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - healthcare.local
      secretName: healthcare-tls
  rules:
    - host: healthcare.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
