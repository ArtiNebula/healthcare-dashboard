# ServiceAccount for backend pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: healthcare-backend
  namespace: healthcare

---
# Role — only allows reading pods/services in healthcare namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: healthcare-role
  namespace: healthcare
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: healthcare-rolebinding
  namespace: healthcare
subjects:
  - kind: ServiceAccount
    name: healthcare-backend
    namespace: healthcare
roleRef:
  kind: Role
  name: healthcare-role
  apiGroup: rbac.authorization.k8s.io

---
# ClusterRole for Prometheus to scrape metrics
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-scraper
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-scraper-binding
subjects:
  - kind: ServiceAccount
    name: default
    namespace: healthcare
roleRef:
  kind: ClusterRole
  name: prometheus-scraper
  apiGroup: rbac.authorization.k8s.io
