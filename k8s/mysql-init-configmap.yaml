  02-seed.sql: "-- ============================================================\n--
    \ Healthcare Dashboard — Seed Data\n--  Run AFTER schema.sql:\n--  mysql -u root
    -p healthcare_db < backend/database/seed.sql\n-- ============================================================\n\nUSE
    healthcare_db;\n\n-- ─── USERS ───────────────────────────────────────────────────\nINSERT
    INTO users (name, email, password, role) VALUES\n  ('John Doe',   'john.doe@example.com',
    \  'password123', 'patient'),\n  ('Jane Smith', 'jane.smith@example.com', 'password123',
    'patient'),\n  ('Admin User', 'admin@hospital.com',     'admin123',    'admin'),\n
    \ ('Dr. Admin',  'dr.admin@hospital.com',  'admin123',    'admin');\n\n-- ───
    DASHBOARD STATS ─────────────────────────────────────────\nINSERT INTO dashboard_stats
    (label, value, icon, color, bg_color, status) VALUES\n  ('Heart Rate',      '72
    bpm', 'Heart',       'bg-red-500',    'bg-red-50',    'normal'),\n  ('Daily Steps',
    \    '8,542',  'Activity',    'bg-blue-500',   'bg-blue-50',   'active'),\n  ('Health
    Score',    '85%',    'TrendingUp',  'bg-green-500',  'bg-green-50',  'good'),\n
    \ ('Active Symptoms', '2',      'AlertCircle', 'bg-orange-500', 'bg-orange-50',
    'monitoring');\n\n-- ─── HEALTH TREND ────────────────────────────────────────────\nINSERT
    INTO health_trend (day_label, value) VALUES\n  ('Mon', 72), ('Tue', 68), ('Wed',
    75),\n  ('Thu', 70), ('Fri', 73), ('Sat', 71), ('Sun', 74);\n\n-- ─── RECENT SYMPTOMS
    ─────────────────────────────────────────\nINSERT INTO recent_symptoms (symptom,
    severity, date_label, time_label) VALUES\n  ('Headache', 'Moderate', 'Today',
    \     '2h ago'),\n  ('Fatigue',  'Mild',     'Yesterday',  '18h ago'),\n  ('Cough',
    \   'Mild',     '2 days ago', '2d ago');\n\n-- ─── AI SUGGESTIONS ──────────────────────────────────────────\nINSERT
    INTO ai_suggestions (text, priority) VALUES\n  ('Consider staying hydrated to
    help with headaches',                       'high'),\n  ('Your symptoms may indicate
    stress - try relaxation techniques',          'medium'),\n  ('Schedule a checkup
    if symptoms persist for more than 3 days',           'low');\n\n-- ─── MICROSERVICES
    ───────────────────────────────────────────\nINSERT INTO microservices (name,
    status, response_time) VALUES\n  ('Auth Service', 'operational', '12ms'),\n  ('AI
    Engine',    'operational', '45ms'),\n  ('Data Sync',    'operational', '28ms');\n\n--
    ─── SYMPTOMS HISTORY ────────────────────────────────────────\nINSERT INTO symptoms_history
    (date, symptoms, severity, severity_score, status, ai_note, duration) VALUES\n
    \ ('2026-04-12', '[\"Headache\",\"Fatigue\"]',  'Moderate', 6, 'Active',   'Possible
    tension headache',  '2 hrs'),\n  ('2026-04-10', '[\"Fatigue\"]',             'Mild',
    \    3, 'Active',   'Rest recommended',           '18 hrs'),\n  ('2026-04-07',
    '[\"Cough\",\"Sore Throat\"]', 'Mild',     4, 'Resolved', 'Viral throat infection',
    \    '3 days'),\n  ('2026-04-05', '[\"Fever\",\"Body Ache\"]',   'Severe',   8,
    'Resolved', 'Flu-like symptoms monitored','2 days'),\n  ('2026-04-03', '[\"Sore
    Throat\"]',         'Mild',     3, 'Resolved', 'Mild pharyngitis',           '1
    day'),\n  ('2026-04-01', '[\"Nausea\",\"Dizziness\"]',  'Moderate', 5, 'Resolved',
    'Possible dehydration',       '6 hrs'),\n  ('2026-03-28', '[\"Headache\"]',            'Mild',
    \    3, 'Resolved', 'Tension headache resolved',  '4 hrs');\n\n-- ─── HEALTH SCORE
    TREND ──────────────────────────────────────\nINSERT INTO health_score_trend (date_label,
    score, symptoms_count) VALUES\n  ('Mar 22', 62, 4), ('Mar 25', 58, 5), ('Mar 28',
    65, 3),\n  ('Apr 01', 70, 2), ('Apr 03', 68, 3), ('Apr 05', 74, 2),\n  ('Apr 07',
    72, 2), ('Apr 09', 78, 1), ('Apr 12', 85, 1);\n\n-- ─── SYMPTOM FREQUENCY ───────────────────────────────────────\nINSERT
    INTO symptom_frequency (symptom, count) VALUES\n  ('Headache', 8), ('Fatigue',
    6), ('Cough', 4), ('Nausea', 3), ('Dizziness', 2);\n\n-- ─── AI ANALYSIS ─────────────────────────────────────────────\nINSERT
    INTO ai_analysis (confidence) VALUES (87);\n\nINSERT INTO ai_conditions (name,
    confidence, severity, color, description, urgency, causes, treatments) VALUES\n
    \ ('Tension Headache', 87, 'Low', 'blue',\n   'A common headache type causing
    mild to moderate pain, often described as feeling like a tight band around the
    head.',\n   'Low',\n   '[\"Stress and anxiety\",\"Poor posture\",\"Eye strain
    from screens\",\"Dehydration\",\"Lack of sleep\"]',\n   '[\"Over-the-counter pain
    relievers (Ibuprofen/Acetaminophen)\",\"Rest in a quiet, dark room\",\"Apply cold
    or warm compress\",\"Stay hydrated\"]'),\n  ('Viral Fatigue Syndrome', 74, 'Medium',
