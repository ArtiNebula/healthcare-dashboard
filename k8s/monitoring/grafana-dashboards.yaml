apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: healthcare
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: healthcare-dashboards
        orgId: 1
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-healthcare-dashboard
  namespace: healthcare
data:
  healthcare.json: |
    {
      "title": "HealthAI — System Overview",
      "uid": "healthcare-overview",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "15s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "API Requests / min",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "round(rate(http_requests_total{job=\"backend\"}[1m]) * 60, 1)",
            "legendFormat": "req/min"
          }],
          "options": { "colorMode": "background", "graphMode": "area" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" },
            "thresholds": { "steps": [
              { "color": "green", "value": 0 },
              { "color": "yellow", "value": 50 },
              { "color": "red", "value": 100 }
            ]}}}
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Avg Response Time (ms)",
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "round(rate(http_request_duration_ms_sum{job=\"backend\"}[5m]) / rate(http_request_duration_ms_count{job=\"backend\"}[5m]), 1)",
            "legendFormat": "ms"
          }],
          "fieldConfig": { "defaults": { "unit": "ms", "color": { "mode": "thresholds" },
            "thresholds": { "steps": [
              { "color": "green", "value": 0 },
              { "color": "yellow", "value": 200 },
              { "color": "red", "value": 500 }
            ]}}}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Error Rate (%)",
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 4 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "round(rate(http_requests_total{job=\"backend\",status=~\"5..\"}[5m]) / rate(http_requests_total{job=\"backend\"}[5m]) * 100, 2)",
            "legendFormat": "error %"
          }],
          "fieldConfig": { "defaults": { "unit": "percent", "color": { "mode": "thresholds" },
            "thresholds": { "steps": [
              { "color": "green", "value": 0 },
              { "color": "yellow", "value": 1 },
              { "color": "red", "value": 5 }
            ]}}}
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Running Pods",
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 4 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "count(kube_pod_status_phase{namespace=\"healthcare\",phase=\"Running\"})",
            "legendFormat": "pods"
          }],
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" },
            "thresholds": { "steps": [
              { "color": "red", "value": 0 },
              { "color": "yellow", "value": 3 },
              { "color": "green", "value": 6 }
            ]}}}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "API Request Rate (by endpoint)",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "rate(http_requests_total{job=\"backend\"}[2m])",
              "legendFormat": "{{method}} {{route}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Container CPU Usage",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "rate(container_cpu_usage_seconds_total{namespace=\"healthcare\",container!=\"\"}[2m]) * 100",
              "legendFormat": "{{container}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percent" } }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Container Memory Usage",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "container_memory_working_set_bytes{namespace=\"healthcare\",container!=\"\"}",
              "legendFormat": "{{container}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 8,
          "type": "logs",
          "title": "Application Logs (backend)",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": "Loki",
              "expr": "{namespace=\"healthcare\", app=\"backend\"}",
              "legendFormat": ""
            }
          ]
        }
      ]
    }
